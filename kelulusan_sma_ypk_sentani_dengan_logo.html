<body class="bg-gray-100 text-gray-800">

  <header class="bg-blue-900 text-white text-center py-10 px-4 shadow-md">
    <img src="logo_ypk.jpeg" alt="Logo Sekolah" class="mx-auto w-28 mb-4 rounded-full shadow-md"/>
    <h1 class="text-3xl font-bold">Pengumuman Kelulusan</h1>
    <h2 class="text-xl mt-2">SMA YPK Sentani</h2>
    <p class="mt-4 max-w-2xl mx-auto">
      Selamat kepada seluruh peserta didik yang telah menyelesaikan pendidikan di SMA YPK Sentani.
      Semoga ilmu yang didapat menjadi bekal berharga untuk melanjutkan ke jenjang berikutnya.
    </p>
    <button onclick="showLogin()" class="mt-6 px-6 py-3 bg-yellow-400 text-blue-900 font-semibold rounded hover:bg-yellow-300 transition">
      LOGIN
    </button>
  </header>

  <section id="loginSection" class="hidden text-center py-12 px-4">
    <h2 class="text-2xl font-semibold mb-4">Cek Kelulusan</h2>
    <p class="mb-4">Masukkan NISN Anda:</p>
    <input id="nisnInput" type="text" placeholder="Masukkan NISN"
      class="border border-gray-300 rounded px-4 py-2 w-64 mb-4 text-center shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
    <br/>
    <button onclick="checkGraduation()" class="px-6 py-2 bg-blue-700 text-white rounded hover:bg-blue-600 transition">
      CEK
    </button>
    <div id="resultDisplay" class="mt-6 text-lg font-medium text-gray-700"></div>
    <button onclick="backToHome()" class="mt-8 px-6 py-2 bg-gray-400 text-white rounded hover:bg-gray-500 transition">
      Kembali
    </button>
  </section>

  <script>
    function showLogin() {
      document.querySelector('header').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
    }

    function backToHome() {
      document.getElementById('loginSection').classList.add('hidden');
      document.querySelector('header').classList.remove('hidden');
      document.getElementById('resultDisplay').textContent = '';
      document.getElementById('nisnInput').value = '';
    }

    function checkGraduation() {
      const nisn = document.getElementById('nisnInput').value.trim();
      const data = graduationData[nisn];
      const resultDiv = document.getElementById('resultDisplay');
      if (data) {
        resultDiv.innerHTML = `Nama: <span class='font-bold'>${data.name}</span><br>Status Kelulusan: <span class='font-bold text-green-600'>${data.status}</span>`;
      } else {
        resultDiv.innerHTML = "<span class='text-red-600'>NISN tidak ditemukan. Harap periksa kembali.</span>";
      }
    }
